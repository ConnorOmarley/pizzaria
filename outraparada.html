<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Pizzaria LoFi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    overflow:hidden;
    background:#000;
}

/* ================================= */
/* HERO */
/* ================================= */

.hero{
    width:100%;
    height:100vh;

    position:relative;

    background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.75)),
    url("https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1974&auto=format&fit=crop");

    background-position:center;
    background-size:cover;

    transition:1.2s;
}

/* MODO ESCURO */

body.dark .hero{

    background:
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.92)),
    url("https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1974&auto=format&fit=crop");

    background-position:center;
    background-size:cover;

    filter:
    brightness(0.55)
    saturate(0.7);

}

/* ================================= */
/* NAVBAR */
/* ================================= */

nav{
    width:100%;

    position:absolute;
    top:0;
    left:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:30px 80px;

    z-index:10;
}

.logo{
    color:white;
    font-size:32px;
    font-weight:700;
    letter-spacing:3px;
}

.menu{
    display:flex;
    gap:40px;
}

.menu a{
    color:white;
    text-decoration:none;
    font-size:15px;
    transition:0.3s;
}

.menu a:hover{
    opacity:0.6;
}

/* ================================= */
/* CONTEUDO */
/* ================================= */

.content{
    position:absolute;

    top:50%;
    left:90px;

    transform:translateY(-50%);

    color:white;

    max-width:650px;
}

.content h1{
    font-size:80px;
    line-height:90px;

    margin-bottom:25px;
}

.content p{
    font-size:18px;
    line-height:34px;

    opacity:0.85;

    margin-bottom:40px;
}

/* BOTÕES */

.buttons{
    display:flex;
    gap:20px;
}

.btn{
    padding:16px 38px;

    border:none;
    border-radius:60px;

    font-size:15px;
    font-weight:600;

    cursor:pointer;

    transition:0.4s;
}

.btn-primary{
    background:#ff7a00;
    color:white;
}

.btn-primary:hover{
    transform:translateY(-4px);

    box-shadow:
    0 12px 30px rgba(255,122,0,0.35);
}

.btn-dark{

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(8px);

    color:white;

    border:1px solid rgba(255,255,255,0.15);
}

.btn-dark:hover{
    background:rgba(255,255,255,0.14);
}

/* ================================= */
/* EFEITO LOFI */
/* ================================= */

.glow{

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,140,0,0.25) 0%,
    rgba(255,140,0,0.08) 45%,
    transparent 75%);

    top:50%;
    right:80px;

    transform:translateY(-50%);

    filter:blur(20px);

    animation:pulse 5s infinite ease-in-out;
}

@keyframes pulse{

    0%{
        transform:translateY(-50%) scale(1);
    }

    50%{
        transform:translateY(-50%) scale(1.08);
    }

    100%{
        transform:translateY(-50%) scale(1);
    }

}

/* ================================= */
/* BOTAO TEMA */
/* ================================= */

.theme-btn{

    position:absolute;

    bottom:40px;
    right:40px;

    width:65px;
    height:65px;

    border-radius:50%;

    border:none;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    color:white;

    font-size:24px;

    cursor:pointer;

    transition:0.4s;

    z-index:20;
}

.theme-btn:hover{

    transform:scale(1.08);

    background:
    rgba(255,255,255,0.15);

}

/* ================================= */
/* RESPONSIVO */
/* ================================= */

@media(max-width:950px){

    nav{
        padding:30px 35px;
    }

    .menu{
        display:none;
    }

    .content{
        left:35px;
        right:35px;
    }

    .content h1{
        font-size:52px;
        line-height:62px;
    }

    .content p{
        font-size:16px;
        line-height:30px;
    }

    .buttons{
        flex-direction:column;
        align-items:flex-start;
    }

    .glow{
        width:300px;
        height:300px;
        right:-50px;
    }

}

</style>
</head>
<body>

<section class="hero">

    <!-- NAV -->

    <nav>

        <div class="logo">
            PIZZARIA
        </div>

        <div class="menu">
            <a href="#">Início</a>
            <a href="#">Cardápio</a>
            <a href="#">Delivery</a>
            <a href="#">Contato</a>
        </div>

    </nav>

    <!-- EFEITO -->

    <div class="glow"></div>

    <!-- TEXTO -->

    <div class="content">

        <h1>
            Noites tranquilas, pizzas incríveis.
        </h1>

        <p>
            Uma pizzaria inspirada no estilo LoFi,
            com ambiente aconchegante, iluminação suave
            e uma experiência feita para relaxar.
        </p>

        <div class="buttons">

            <button class="btn btn-primary">
                Ver Cardápio
            </button>

            <button class="btn btn-dark" onclick="toggleTheme()">
                Alternar Ambiente
            </button>

        </div>

    </div>

    <!-- BOTAO FLUTUANTE -->

    <button class="theme-btn" onclick="toggleTheme()">
        🌙
    </button>

</section>

<script>

function toggleTheme(){

    document.body.classList.toggle("dark");

    const btn = document.querySelector(".theme-btn");

    if(document.body.classList.contains("dark")){

        btn.innerHTML = "☀️";

    }else{

        btn.innerHTML = "🌙";

    }

}

</script>

</body>
</html>
